{% assign candidate = include.candidate %}
<article class="city-candidate-card">
  <a href="{{ candidate.profile_url | relative_url }}" class="city-candidate-card__link">
    <div class="city-candidate-card__thumb">
      <img
        src="{{ candidate.thumbnail | relative_url }}"
        alt="{{ candidate.name }} thumbnail"
        loading="lazy"
        onerror="this.style.display='none'; this.nextElementSibling.style.display='grid';"
      >
      <div class="city-candidate-card__thumb-fallback" aria-hidden="true">
        <span>{{ candidate.name | slice: 0, 1 }}</span>
      </div>
    </div>
    <div class="city-candidate-card__body">
      <p class="candidate-city city">{{ candidate.city | capitalize }}</p>
      <h3 class="candidate-name name">{{ candidate.name }}</h3>
      <p class="candidate-office office">{{ candidate.office }}</p>
    </div>
  </a>
</article>
