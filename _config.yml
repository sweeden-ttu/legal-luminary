# =============================================================================
# Central Texas Legal Resource - Jekyll Configuration
# =============================================================================
# This configuration works with GitHub Actions deployment
# See: .github/workflows/jekyll.yml

# Site Settings
title: "Legal Luminary"
logo: /assets/imgs/legal-luminary-research-tool.svg
description: "Who's who on the Central Texas bench: every elected judge in Bell County and the statewide courts on its ballot, with sourced profiles"
tagline: "The Central Texas Bench • Sourced • Verified"
author: "Central Texas Legal Resource"
email: "notary@legalluminary.com"
lang: en-US

# Google Tag Manager
# Replace GTM-XXXXXXX with your actual GTM container ID after setup
gtm_container_id: "GTM-KBVFD8NL"

# URL Configuration
# For GitHub Pages project site (username.github.io/repo-name):
#   baseurl: "/repo-name"
#   url: "https://sweeden-ttu.github.io/legal-luminary"
# For custom domain or user site (username.github.io):
#   baseurl: ""
#   url: "https://legalluminary.com"
baseurl: ""
url: "https://www.legalluminary.com"

# Build Settings
markdown: kramdown
highlighter: rouge
permalink: pretty
timezone: America/Chicago

# Kramdown options
kramdown:
  input: GFM
  syntax_highlighter: rouge
  hard_wrap: false

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# Sass/SCSS Processing
# We keep the GitHub Pages default theme, but we do NOT want it to build its SCSS
# (Ruby sass has encoding issues on some environments). We serve our own CSS.
theme: null

# Site Navigation
navigation:
  - title: Home
    url: /
  - title: The Bench
    url: /candidates/courts/
    alt: Every elected judge in Bell County and the statewide seats on its ballot
    children:
      - title: Supreme Court & Court of Criminal Appeals
        url: /courts/statewide/
      - title: Courts of Appeals
        url: /courts/appeals/
      - title: District Courts
        url: /courts/district/
      - title: County Courts at Law & County Judge
        url: /courts/county/
      - title: Justices of the Peace
        url: /courts/jp/
      - title: Court Directory (addresses & phones)
        url: /court-directory/
  - title: Elections
    url: /nov-3-2026-ballot-guide/
    alt: Killeen & Bell County ballot guide for the November 3, 2026 election
    children:
      - title: Nov. 3, 2026 Ballot Guide
        url: /nov-3-2026-ballot-guide/
      - title: How to Run for Judge
        url: /run-for-judge/
      - title: Voting in Bell County
        url: /elections/
  - title: Attorneys
    url: /attorneys/
  - title: News
    url: /legal-news/
  - title: About
    url: /about/
    children:
      - title: Sources
        url: /advertise/
      - title: Corrections
        url: /corrections/
      - title: Scorecard Methodology
        url: /methodology/

# Service Area Information
service_area:
  county: "Bell County"
  state: "Texas"
  cities:
    - Killeen
    - Temple
    - Belton
    - Harker Heights
    - Copperas Cove
    - Nolanville
    - Salado


# Service Area Information
service_area:
