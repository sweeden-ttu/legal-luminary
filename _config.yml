# Collections (if needed for future expansion)
collections_dir: collections

# Build Output
destination: _site
keep_files:
  - .git
  - .nojekyll

# Exclude from processing
exclude:
  # Repository documents that are not site content (removed from the build 2026-11-03)
  - Design.md
  - README_NOTARIES.md
  - research-results.md
  - Project_Rubric_and_Report.html
  - archive
  - modules
  - specs
  - scripts/legacy
  - .review
  - ll
  # Source code, data dumps, scripts and tooling: never site content (excluded 2026-11-03)
  - Johnson.side
  - agent_claude.sh
  - config
  - demos
  - discovery_agent.py
  - downloaded-js
  - fix_frontmatter.rb
  - fix_yaml.rb
  - judge_scorecards.rb
  - lib
  - package.json
  - package-lock.json
  - phase2_details.rb
  - phase2_retry.rb
  - playwright.config.ts
  - progress.json
  - pyproject.toml
  - pytest.ini
  - requirements.txt
  - requirements_adk.txt
  - requirements_brokenlinks.txt
  - requirements_notaries.txt
  - research_fcc_call_letters.py
  - run_doctor_tests.py
  - run_judge.rb
  - run_notary_finder.py
  - scrape_judges.rb
  - scrape_other_judges.rb
  - scraped_data
  - scripts
  - search-legal-terms.sh
  - services
  - spawn_discovery_agent.sh
  - src
  - state.py
  - tasks.json
  - tasks_from_test_cases.json
  - test_detail.rb
  - test_extract.rb
  - test_judgment.rb
  - test_pdf_extraction.py
  - test_scrape.rb
  - tests
  - texas_data_crawler.py
  - tsconfig.json
  - update_articles.py
  - update_news.js
  - update_profiles.rb
  - uv.lock
  - validators
  - verification
  - verifier
  - verify_selenium.py
  - .git
  - .github
  - .gitignore
  - .ruby-version
  - .bundle
  - .claude
  - Gemfile
  - Gemfile.lock
  - README.md
  - AGENTS.md
  - LICENSE
  - node_modules
  - agents
  - vendor
  - "*.gemspec"
  - CNAME.example
  - docker-compose.yml
  - Dockerfile
  - docs
  - test_cases
  - "*.scss"
  - modules/judiciary-rd-agent/agent_oriented_programming_ch5.md

# Include files that should be processed
include:
  - _pages
  - _posts
  - .nojekyll
# Collections
collections:
  candidates:
    output: true
    permalink: /candidates/:path/

# Defaults for pages
defaults:
  - scope:
      path: "modules"
    values:
      robots: "noindex,nofollow"
  - scope:
      path: "archive"
    values:
      robots: "noindex,follow"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"

# Meseeks: officials and candidates this site closely follows, as named by the Killeen Daily Herald
# (see _data/meseeks_following.yml for roles as reported, date and source).
meseeks_following: _data/meseeks_following.yml
