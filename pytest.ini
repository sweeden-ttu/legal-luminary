[pytest]
addopts = --ignore=_site --ignore=vendor/bundle/ruby/2.6.0/gems/ffi-1.17.3/ext/ffi_c/libffi/testsuite
testpaths = tests
# src/ holds the `agent` package (see pyproject.toml); make it importable without `pip install -e .`
pythonpath = . src
markers =
    integration: marks tests as integration tests (deselect with '-m "not integration"')
    selenium: marks tests requiring selenium/browser
    unit: marks tests as unit tests
    network: marks tests that need internet access
    llm: marks tests that call a billed LLM (Claude in tests/adk, OpenAI in the legacy suite; needs that provider's API key)

[tool:pytest]
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
