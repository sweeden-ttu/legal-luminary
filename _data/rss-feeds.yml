# RSS Feed Configuration for Legal News
# Sources validated for Bell County Texas and Texas state legal news

feeds:
  # Local Bell County Sources
  - name: "City of Killeen"
    # NOTE: Killeen's /rss.aspx is an HTML landing page, not RSS XML.
    # The actual RSS endpoints are not reliably accessible (404) from this environment.
    # Leave this disabled until a working XML URL is confirmed.
    url: "https://www.killeentexas.gov/RSSFeed.aspx?ModID=76&CID=All-0"
    category: "local"
    type: "government"
    max_items: 10
    enabled: false
    
  - name: "Killeen Daily Herald"
    url: "https://kdhnews.com/search/?f=rss&t=article&l=50&s=start_time&sd=desc&k%5B%5D=%23topstory"
    category: "local"
    type: "news"
    max_items: 15
    enabled: true
    
  # Bell County Police Department RSS Feeds
  - name: "Killeen Police Department"
    url: "https://killeenpdnews.com/feed/"
    category: "local"
    type: "police"
    max_items: 15
    enabled: true
    
  - name: "Temple Police Department"
    url: "https://city-of-temple.prowly.com/rss"
    category: "local"
    type: "police"
    max_items: 15
    enabled: true
    note: "Includes all Temple city news; TPD releases are included"

  - name: "Belton Police Department"
    url: "https://www.beltontexas.gov/newslist.php"
    category: "local"
    type: "police"
    max_items: 10
    enabled: false
    note: "RSS feed not available; may need alternative source"

  # FCC-Licensed Local TV Affiliates (Waco-Temple-Bryan DMA, serves Bell County)
  # Verified RSS endpoints below.
  - name: "KXAN Austin (NBC)"
    url: "https://www.kxan.com/feed/"
    category: "local"
    type: "broadcast-tv"
    fcc_call_letters: "KXAN"
    network: "NBC"
    market: "Austin / Central Texas"
    max_items: 15
    enabled: true

  - name: "KCEN Waco-Temple (NBC)"
    # kcen.com does not expose an XML endpoint from this environment; the
    # /news/ page is HTML, not RSS. Disabled until a working XML URL is confirmed.
    url: "https://www.kcen.com/feed/"
    category: "local"
    type: "broadcast-tv"
    fcc_call_letters: "KCEN"
    network: "NBC"
    market: "Waco-Temple-Bryan"
    max_items: 15
    enabled: false
    note: "kcen.com/feed/ returns HTML, not RSS XML; awaiting confirmed XML endpoint"

  - name: "Texas Tribune (Statewide)"
    url: "https://www.texastribune.org/feed/"
    category: "state"
    type: "news"
    max_items: 15
    enabled: true

  - name: "Killeen Daily Herald (RSS)"
    url: "https://www.kdhnews.com/search/?f=rss"
    category: "local"
    type: "news"
    max_items: 15
    enabled: true

  # Texas State Government Sources
  # Texas Legislature RSS (use RSS.aspx?Type=... for XML; RSSFeeds.aspx returns HTML)
  - name: "Texas Legislature - Today's Bills Filed"
    url: "https://capitol.texas.gov/MyTLO/RSS/RSS.aspx?Type=todaysfiledhouse"
    category: "state"
    type: "legislature"
    max_items: 10
    enabled: true
    
  - name: "Texas Legislature - Today's Passed Bills"
    url: "https://capitol.texas.gov/MyTLO/RSS/RSS.aspx?Type=todaysbillspassed"
    category: "state"
    type: "legislature"
    max_items: 10
    enabled: true
    
  - name: "Texas Legislature - Upcoming House Committee Meetings"
    url: "https://capitol.texas.gov/MyTLO/RSS/RSS.aspx?Type=upcomingmeetingshouse"
    category: "state"
    type: "legislature"
    max_items: 10
    enabled: true
    
  - name: "Texas Legislature - Upcoming Senate Committee Meetings"
    url: "https://capitol.texas.gov/MyTLO/RSS/RSS.aspx?Type=upcomingmeetingssenate"
    category: "state"
    type: "legislature"
    max_items: 10
    enabled: true

# Configuration
config:
  max_age_days: 30  # Only show items from last 30 days
  timeout_seconds: 10  # HTTP request timeout
  retry_attempts: 2  # Number of retry attempts for failed feeds
  delay_between_feeds: 1  # Seconds to wait between feed requests
